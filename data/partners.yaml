  description_partners: |
    AENIUM is a Spanish additive manufacturing and materials engineering SME, established in 2018 and headquartered in the Boecillo Technology Park (Valladolid). The company delivers end-to-end industrialisation of high-value metal components through qualified laser-based additive manufacturing, supported by advanced alloy and powder engineering, process and inspection procedure development, and in-house post-processing, metrology, and testing for final part qualification and certification. AENIUM serves demanding sectors including space hardware, defence, energy and industrial applications, leveraging vertically integrated capabilities and international partnerships to support OEM programmes from concept design to serial production readiness.

    In DAMAGER, AENIUM contributes to:

    - AM production of turbojet components for low-cost, scalable manufacturing
    - Qualification of materials and processes for expendable systems
    - Enabling rapid manufacturing cycles for large-volume deployment
