  role_partners: "Research — CFD and thermal analysis"
  description_partners: |
    ERGON RESEARCH was founded in 2008, nominated spin-off of the University of Florence from 2012 to 2022 and is currently recognized also Innovative SME. It is specialized in technology transfer from the research world to the industry, working in the fields of combustion, energy, fluid dynamics, turbomachinery and thermal management. Ergon Research counts about 35 people, 12 of which have a PhD in Engineering, Chemistry or Physics, and an internal HPC cluster of 1000+ cores. The mission is to innovate products by exploiting simulations (CFD, FEM, MBSE), developing codes and supporting experimental tests. The company and its members have large experience in regional, national and European funded R&D programmes (FP7, Horizon Europe, Clean Sky 2, Clean Aviation, FF4EuroHPC, EuroHPC and European Defence Fund).

    In DAMAGER, ERGON contributes to:

    - Thermofluid design of recuperators and combustors
    - Design for AM and thermomechanical verifications of all components
    - Validation of enabling technologies based on experimental testing
