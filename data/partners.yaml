  logo_alt: "HIT09 SRL logo"
  role_home: "Project Coordinator"
  description_home: "HIT09 SRL is an Italian SME specialized in advanced design and engineering for aerospace and defence applications. As coordinator of DAMAGER, HIT09 leads the consortium and oversees all technical and administrative activities."
  role_partners: "Project Coordinator"
  description_partners: |
    HIT09 (Coordinator) is an Italian SME created in 2010 as a spin-off company from the University of Padova, which offers specialised engineering and consultancy services in Aerospace & Defence. Main competencies are in the field of design optimisation, numerical simulations and code development with a focus in aircraft propulsion systems design and propulsion/airframe integration. In addition, HIT09 is dedicated to design, prototyping and testing of small propulsors for UAV and/or ultra-light aircrafts. HIT09 members combine decades of expertise in various fields of mechanical and aerospace engineering, ranging from design of propulsion systems, computational analyses and experimental measurements, to the design and realization of complex systems that have been also tested in flight. HIT09 is deeply involved in EU-funded research projects in aeronautics (15+) mainly devoted to aircraft and propulsion design optimisation and complex fluid-dynamic numerical simulations including testing in wind tunnels. Currently coordinator of two EDF projects.

    In DAMAGER, HIT09 contributes to:

    - Multidisciplinary optimisation of highly-efficient, low-cost turbojet architectures
    - Integrated aero-propulsive performance modelling
    - Design strategies enabling rapid manufacturing and deployment
  website: "https://www.hit09.com/advanced-design"
  linkedin: "https://www.linkedin.com/company/hit09-srl/"

