  description_home: "Lithoz GmbH is a world-leading Austrian company in high-performance ceramic additive manufacturing. Within DAMAGER, Lithoz contributes expertise in 3D printing of ceramic components for high-temperature turbine applications."
  role_partners: "Expert in ceramic additive manufacturing"
  description_partners: |
    LITHOZ is a R&D driven SME which develops and distributes AM systems for ceramic materials on the basis of the patented Lithography-based Ceramic Manufacturing (LCM) technology. This technology is capable of structuring a broad range of photopolymers, including ceramic filled resins. Lithoz covers the whole process chain from the material development over the material processing to the development of the hard- and software, making them to a strong partner for R&D projects. Lithoz is continuously developing their LCM process and is building up a unique know-how in this field through continuous innovation and development. Lithoz currently employs 40 researchers working on the development of the machine, photopolymerizable resins, ceramics, software and application technology.

    In DAMAGER, LITHOZ contributes to:

    - Ceramic AM processes for turbojet components exposed to extreme conditions
    - Development of materials enabling high-temperature, low-cost solutions
    - Prototyping and testing of critical ceramic elements
  website: "https://www.lithoz.com/en/"
  linkedin: "https://www.linkedin.com/company/lithoz/"

